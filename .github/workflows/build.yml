name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build plugin
        run: cmake --build build --target Ostrov_VST3 Ostrov_AU Ostrov_Standalone --parallel

      - name: Sign (ad-hoc)
        run: |
          A=build/Ostrov_artefacts/Release
          for b in "$A/VST3/Ostrov.vst3" "$A/AU/Ostrov.component" "$A/Standalone/Ostrov.app"; do
            codesign --force --deep --sign - "$b"
          done
          lipo -info "$A/VST3/Ostrov.vst3/Contents/MacOS/Ostrov"

      - name: Validate AU (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Ostrov_artefacts/Release/AU/Ostrov.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu Ostr Tmjn

      - name: Validate VST3 (pluginval)
        run: |
          curl -sL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process \
            --skip-gui-tests build/Ostrov_artefacts/Release/VST3/Ostrov.vst3

      - name: Package
        run: |
          A=build/Ostrov_artefacts/Release
          mkdir -p pkg dist
          cp -R "$A/VST3/Ostrov.vst3" "$A/AU/Ostrov.component" "$A/Standalone/Ostrov.app" pkg/
          cp tools/install.sh pkg/ && chmod +x pkg/install.sh
          (cd pkg && ditto -c -k . ../dist/Ostrov-mac.zip)

      - uses: actions/upload-artifact@v4
        with:
          name: Ostrov-mac
          path: dist/Ostrov-mac.zip

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Ostrov 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Установка одной командой в Терминале:
            curl -L https://github.com/Timmyjin123/Ostrov/releases/latest/download/Ostrov-mac.zip -o /tmp/Ostrov.zip && rm -rf /tmp/Ostrov && unzip -q /tmp/Ostrov.zip -d /tmp/Ostrov && bash /tmp/Ostrov/install.sh
          files: dist/Ostrov-mac.zip

  demo-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render demo WAVs
        run: |
          g++ -O2 -std=c++17 -o render tools/render_demo.cpp
          mkdir -p demo && ./render demo
      - uses: actions/upload-artifact@v4
        with:
          name: Ostrov-demo-audio
          path: demo/*.wav
